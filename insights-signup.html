<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon.png" />
<title>Join the Insights Community — Kyle & Co</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H95H1WFLGC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-H95H1WFLGC');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F7F1EA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #fff; border-radius: 12px; padding: 3rem 3rem 2.5rem; max-width: 480px; width: 100%; box-shadow: 0 2px 24px rgba(39,55,82,0.08); }
  .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
  .brand-mark { width: 32px; height: 32px; background: #273752; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 1.1rem; font-style: italic; color: #FDECCD; flex-shrink: 0; }
  .brand-label { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: #9D92AD; font-weight: 500; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 400; line-height: 1.15; letter-spacing: -0.02em; color: #273752; margin-bottom: 0.6rem; }
  .sub { font-size: 0.9rem; line-height: 1.6; color: #555961; margin-bottom: 2rem; }
  form { display: flex; flex-direction: column; gap: 0.75rem; }
  input { width: 100%; padding: 0.75rem 1rem; border: 1px solid rgba(39,55,82,0.18); border-radius: 8px; font-size: 0.9rem; font-family: inherit; color: #273752; background: #fff; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: #273752; }
  input::placeholder { color: #9D92AD; }
  .btn { margin-top: 0.25rem; background: #273752; color: #F7F1EA; border: none; border-radius: 100px; padding: 1rem 1.5rem; font-size: 0.95rem; font-weight: 500; font-family: inherit; cursor: pointer; width: 100%; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .note { font-size: 0.72rem; color: #9D92AD; text-align: center; margin-top: 0.75rem; }
  .success { text-align: center; padding: 1.5rem 0; display: none; }
  .success h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 400; color: #273752; margin-bottom: 0.75rem; }
  .success p { font-size: 0.9rem; color: #555961; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <a href="https://kyleandco.com" style="display:inline-flex;align-items:center;gap:0.75rem;text-decoration:none;">
      <span class="brand-mark">&amp;</span>
      <span class="brand-label">Kyle &amp; Co</span>
    </a>
  </div>

  <div id="form-view">
    <h1>Join the<br />Insights Community.</h1>
    <p class="sub">Research, frameworks, and practitioner perspectives on AI in HR — direct from Kyle &amp; Co. No noise. No spam.</p>

    <form id="insights-form" action="https://assets.mailerlite.com/jsonp/1555935/forms/155676694376613273/subscribe" method="post" target="ml-submit-frame">
      <input required type="text" name="fields[name]" placeholder="First name" />
      <input required type="email" name="fields[email]" placeholder="Work email" />
      <input type="hidden" name="ml-submit" value="1" />
      <input type="hidden" name="anticsrf" value="true" />
      <button type="submit" class="btn" id="submit-btn">Join the community →</button>
      <p class="note">From Kyle &amp; Co. Unsubscribe anytime.</p>
    </form>
  </div>

  <div class="success" id="success-view">
    <h2>You're in.</h2>
    <p>Welcome to the community. Expect research and perspectives worth your time — nothing else.</p>
  </div>
</div>

<iframe name="ml-submit-frame" title="Form submission" style="display:none;"></iframe>

<script>
  document.getElementById('insights-form').addEventListener('submit', function() {
    if (window.gtag) window.gtag('event', 'form_submit', { form_name: 'insights_community' });
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Joining…';
    setTimeout(function() {
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
    }, 1000);
  });
</script>
</body>
</html>
